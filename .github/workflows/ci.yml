name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA, with its tag in a comment; Dependabot bumps both.
# Package jobs (TS lint/typecheck/test, Python ruff/mypy/pytest) arrive with #3 and #4 and
# are added to ci-pass's needs (with the results check), so branch protection never changes.

jobs:
  # The one check branch protection requires: green only if every job it needs is.
  # No package jobs exist yet, so it is a placeholder that passes until #3 and #4 add them.
  ci-pass:
    name: ci-pass
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder until package jobs land
        run: echo "no jobs to check yet"
