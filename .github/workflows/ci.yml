name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA, with its tag in a comment; Dependabot bumps both.
# Package jobs (TS lint/typecheck/test, Python ruff/mypy/pytest) arrive with #3 and #4 and
# are added to ci-pass's needs, so branch protection never changes.

jobs:
  denylist:
    name: denylist (ADR-008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No real names or pharmacy identity
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/denylist-check.sh "${BASE:-}"

  # The one check branch protection requires: green only if every job above is.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [denylist]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
