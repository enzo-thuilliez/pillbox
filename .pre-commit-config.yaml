# `pre-commit install` sets up both the pre-commit and the commit-msg stages.
# Package hooks (Biome/ESLint, ruff) arrive with the monorepo scaffold (#3).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      # Uses the gitleaks binary installed by my-starter-kit's install.sh (no Go toolchain needed).
      - id: gitleaks-system
        pass_filenames: false
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
